<style>
/* Layout: 国語辞典の版面。左に五十音の爪（つめ）、本文は見出し語＋〔品詞〕風ラベル＋用例の一段組み */
:root{
  --paper:#f5f6f3;
  --sheet:#ffffff;
  --ink:#1f2328;
  --ink-soft:#5b6168;
  --rule:#d9dcd6;
  --ai:#27466f;          /* 藍：唯一のアクセント */
  --ai-wash:#e6ecf4;
  --ng:#9a3b32;          /* 避けたい例（意味色） */
  --ng-wash:#f6e9e6;
  --ok:#2f6b4f;          /* 言い換え（意味色） */
  --ok-wash:#e5f1ea;
  --f-head:"Zen Old Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --step--1:.8125rem; --step-0:.9375rem; --step-1:1.125rem; --step-2:1.5rem; --step-3:2.25rem;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#15181c; --sheet:#1c2026; --ink:#e7e9ec; --ink-soft:#a3a9b1; --rule:#30363e;
  --ai:#8fb0dc; --ai-wash:#1f2a3a; --ng:#e59a8f; --ng-wash:#33211f; --ok:#88c9a6; --ok-wash:#1b2e25;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#15181c; --sheet:#1c2026; --ink:#e7e9ec; --ink-soft:#a3a9b1; --rule:#30363e;
  --ai:#8fb0dc; --ai-wash:#1f2a3a; --ng:#e59a8f; --ng-wash:#33211f; --ok:#88c9a6; --ok-wash:#1b2e25;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:var(--step-0);line-height:1.8}
.wrap{max-width:60rem;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* 表紙 */
header.cover{padding-block:2.5rem 1.5rem;display:grid;gap:1rem}
.cover .edition{font-size:var(--step--1);letter-spacing:.2em;color:var(--ink-soft)}
.cover h1{font-family:var(--f-head);font-weight:900;font-size:clamp(2rem,6vw,3.25rem);line-height:1.2;margin:0;text-wrap:balance}
.cover h1 ruby rt{font-family:var(--f-body);font-size:.28em;font-weight:500;letter-spacing:.1em;color:var(--ink-soft)}
.cover .lead{max-width:38em;margin:0;color:var(--ink-soft)}
.cover .lead b{color:var(--ink);font-weight:700}
.legend{display:flex;flex-wrap:wrap;gap:.5rem 1.25rem;font-size:var(--step--1);color:var(--ink-soft);margin:0;padding:0;list-style:none}
.legend li{display:flex;gap:.4rem;align-items:center}

/* 今日のひとつ */
.today{background:var(--ai);color:var(--sheet);border-radius:4px;padding:1rem 1.25rem;display:grid;gap:.25rem;grid-template-columns:1fr auto;align-items:center}
.today .lbl{font-size:var(--step--1);letter-spacing:.15em;opacity:.85}
.today .w{font-family:var(--f-head);font-weight:700;font-size:var(--step-1);line-height:1.5}
.today button{background:transparent;color:inherit;border:1px solid currentColor;border-radius:999px;padding:.3rem .9rem;font:inherit;font-size:var(--step--1);cursor:pointer;grid-row:span 2}
.today a{color:inherit}

/* 検索バー */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--rule);padding-block:.75rem}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.bar .wrap{display:grid;gap:.6rem}
.searchrow{display:flex;gap:.75rem;align-items:center;flex-wrap:wrap}
.search{flex:1 1 16rem;min-width:0;position:relative}
.search input{width:100%;font:inherit;font-size:1rem;padding:.6rem .9rem;border:1px solid var(--rule);border-radius:4px;background:var(--sheet);color:var(--ink)}
.search input:focus-visible{outline:2px solid var(--ai);outline-offset:1px}
.progress{font-size:var(--step--1);color:var(--ink-soft);white-space:nowrap;font-variant-numeric:tabular-nums}
.progress b{color:var(--ai);font-size:var(--step-0)}
.chips{display:flex;gap:.4rem;flex-wrap:wrap}
.chip{font:inherit;font-size:var(--step--1);padding:.2rem .75rem;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ai);border-color:var(--ai);color:var(--sheet)}
.chip:focus-visible,.kana a:focus-visible,button:focus-visible{outline:2px solid var(--ai);outline-offset:2px}

/* 本文：爪＋項目 */
main.wrap{display:grid;grid-template-columns:2.5rem minmax(0,1fr);gap:1.25rem;padding-block:1.5rem 4rem}
nav.kana{position:sticky;top:9.5rem;align-self:start;display:flex;flex-direction:column;gap:2px}
.kana a{display:block;text-align:center;font-family:var(--f-head);font-weight:700;padding:.3rem 0;text-decoration:none;color:var(--ai);background:var(--ai-wash);border-radius:0 4px 4px 0}
.kana a[aria-disabled="true"]{color:var(--ink-soft);background:transparent;opacity:.45;pointer-events:none}
.entries{display:grid;gap:0;min-width:0}
h2.row{font-family:var(--f-head);font-weight:900;font-size:var(--step-2);color:var(--ai);margin:1.5rem 0 .25rem;display:flex;align-items:baseline;gap:.75rem;scroll-margin-top:10rem}
h2.row:first-child{margin-top:0}
h2.row::after{content:"";flex:1;border-top:1px solid var(--rule)}
article.entry{padding-block:1.25rem;border-bottom:1px dotted var(--rule);display:grid;gap:.6rem;scroll-margin-top:10rem}
article.entry.flash{animation:flash 1.6s ease-out}
@keyframes flash{from{background:var(--ai-wash)}to{background:transparent}}
.hw{display:flex;flex-wrap:wrap;align-items:baseline;gap:.25rem .75rem}
.hw .yomi{font-size:var(--step--1);color:var(--ink-soft);letter-spacing:.05em;flex-basis:100%}
.hw h3{font-family:var(--f-head);font-weight:700;font-size:var(--step-1);margin:0;line-height:1.5;text-wrap:balance}
.hw h3::before{content:"【";color:var(--ink-soft);font-weight:500}
.hw h3::after{content:"】";color:var(--ink-soft);font-weight:500}
.tag{font-size:var(--step--1);color:var(--ai);white-space:nowrap}
.cat{font-size:var(--step--1);color:var(--ink-soft);white-space:nowrap}
.got{margin-left:auto;font:inherit;font-size:var(--step--1);border:1px solid var(--rule);background:var(--sheet);color:var(--ink-soft);border-radius:999px;padding:.15rem .7rem;cursor:pointer;white-space:nowrap}
.got[aria-pressed="true"]{border-color:var(--ok);color:var(--ok);background:var(--ok-wash)}
.pair{display:grid;grid-template-columns:repeat(auto-fit,minmax(15rem,1fr));gap:.5rem}
.ex{border-radius:4px;padding:.55rem .8rem;font-size:var(--step-0);line-height:1.7}
.ex .mk{font-weight:700;font-size:var(--step--1);display:block;letter-spacing:.08em}
.ex.ng{background:var(--ng-wash)}
.ex.ng .mk{color:var(--ng)}
.ex.ok{background:var(--ok-wash)}
.ex.ok .mk{color:var(--ok)}
.def{margin:0;max-width:40em}
.def .lbl,.see .lbl{display:inline-block;font-size:var(--step--1);font-weight:700;color:var(--sheet);background:var(--ink-soft);border-radius:2px;padding:0 .35rem;margin-right:.4rem;line-height:1.6}
.see{margin:0;font-size:var(--step--1);color:var(--ink-soft)}
.see a{color:var(--ai)}
.empty{padding:2rem 0;color:var(--ink-soft)}
.empty button{font:inherit;color:var(--ai);background:none;border:none;text-decoration:underline;cursor:pointer;padding:0}
mark{background:var(--ai-wash);color:inherit;padding:0 .1em}

footer.colophon{border-top:1px solid var(--rule);padding-block:1.5rem 3rem;font-size:var(--step--1);color:var(--ink-soft)}
footer.colophon p{margin:.25rem 0;max-width:44em}

@media (max-width:560px){
  main.wrap{grid-template-columns:minmax(0,1fr)}
  nav.kana{position:static;flex-direction:row;flex-wrap:wrap}
  .kana a{flex:1 0 2rem;border-radius:4px}
  nav.kana{order:-1}
  .today{grid-template-columns:1fr}
  .today button{grid-row:auto;justify-self:start}
}
@media (prefers-reduced-motion:reduce){article.entry.flash{animation:none}html{scroll-behavior:auto}}
html{scroll-behavior:smooth}
</style>

<header class="cover wrap">
  <div class="edition">第一版　二〇二六年秋</div>
  <h1><ruby>いまどき<rt>いまどき</rt></ruby>ご配慮辞典</h1>
  <p class="lead">悪気はなかったのに、相手を傷つけてしまう。そんな「ひと言」と「ふるまい」を集めました。正解はひとつではありません。<b>迷ったら相手に聞く</b>のが、いちばんのご配慮です。</p>
  <ul class="legend" aria-label="凡例">
    <li><span class="tag">〔ことば〕</span>言い方の配慮</li>
    <li><span class="tag">〔ふるまい〕</span>行動の配慮</li>
    <li><span class="tag" style="color:var(--ng)">▲ 避けたい</span>悪気なく出がちな例</li>
    <li><span class="tag" style="color:var(--ok)">○ こう言う</span>言い換え・代わりの行動</li>
  </ul>
  <div class="today" id="today" aria-live="polite">
    <span class="lbl">きょうのご配慮</span>
    <span class="w" id="todayWord"></span>
    <button type="button" id="shuffle">ほかのを見る</button>
  </div>
</header>

<div class="bar">
  <div class="wrap">
    <div class="searchrow">
      <label class="search"><span hidden>辞典を検索</span>
        <input id="q" type="search" placeholder="ことばで引く（例：結婚、飲み会、SNS）" autocomplete="off">
      </label>
      <span class="progress" id="progress"></span>
    </div>
    <div class="chips" id="chips" role="group" aria-label="分野で絞り込む"></div>
  </div>
</div>

<main class="wrap">
  <nav class="kana" id="kana" aria-label="五十音で引く"></nav>
  <div class="entries" id="entries"></div>
</main>

<footer class="colophon wrap">
  <p>この辞典は、相手を責めるためのものではなく、自分の言葉を選ぶためのものです。言い換えは一例で、相手や場面によって受け止め方は変わります。</p>
  <p>「身についた」の記録は、この端末のブラウザにだけ保存されます。</p>
</footer>

/* 五十音の行 */
const ROWS=[["あ","あいうえお"],["か","かきくけこ"],["さ","さしすせそ"],["た","たちつてと"],["な","なにぬねの"],["は","はひふへほ"],["ま","まみむめも"],["や","やゆよ"],["ら","らりるれろ"],["わ","わをん"]];
const rowOf=y=>{const ch=y.normalize("NFD")[0];const r=ROWS.find(([,s])=>s.includes(ch));return r?r[0]:"わ"};
E.forEach(e=>e.row=rowOf(e.y));
E.sort((a,b)=>a.y.localeCompare(b.y,"ja"));
const byId=Object.fromEntries(E.map(e=>[e.id,e]));

let got=new Set();
try{got=new Set(JSON.parse(localStorage.getItem("gohairyo-got")||"[]"))}catch(_){}
const saveGot=()=>{try{localStorage.setItem("gohairyo-got",JSON.stringify([...got]))}catch(_){}};

const state={q:"",cat:null};
const $=s=>document.querySelector(s);
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const hl=s=>{const t=esc(s);if(!state.q)return t;const q=esc(state.q).replace(/[.*+?^${}()|[\]\\]/g,"\\$&");return t.replace(new RegExp(q,"g"),m=>`<mark>${m}</mark>`)};

function chips(){
  const el=$("#chips");
  el.innerHTML=[`<button type="button" class="chip" data-cat="" aria-pressed="${!state.cat}">すべて</button>`]
    .concat(CATS.map(c=>`<button type="button" class="chip" data-cat="${c}" aria-pressed="${state.cat===c}">${c}</button>`)).join("");
}
function match(e){
  if(state.cat&&e.c!==state.cat)return false;
  if(!state.q)return true;
  return [e.w,e.y,e.ng,e.ok,e.why,e.c,e.k].some(t=>t.includes(state.q));
}
function render(){
  const list=E.filter(match);
  const rowsPresent=new Set(list.map(e=>e.row));
  $("#kana").innerHTML=ROWS.map(([r])=>`<a href="#row-${r}" ${rowsPresent.has(r)?"":'aria-disabled="true" tabindex="-1"'}>${r}</a>`).join("");
  let html="",cur=null;
  for(const e of list){
    if(e.row!==cur){cur=e.row;html+=`<h2 class="row" id="row-${cur}">${cur}行</h2>`}
    const see=e.see.filter(id=>byId[id]).map(id=>`<a href="#${id}" data-jump="${id}">${byId[id].w}</a>`).join("、");
    const on=got.has(e.id);
    html+=`<article class="entry" id="${e.id}">
      <div class="hw">
        <span class="yomi">${hl(e.y)}</span>
        <h3>${hl(e.w)}</h3>
        <span class="tag">〔${e.k}〕</span><span class="cat">${e.c}</span>
        <button type="button" class="got" data-got="${e.id}" aria-pressed="${on}">${on?"✓ 身についた":"身についた"}</button>
      </div>
      <div class="pair">
        <div class="ex ng"><span class="mk">▲ 避けたい</span>${hl(e.ng)}</div>
        <div class="ex ok"><span class="mk">○ こう言う・こうする</span>${hl(e.ok)}</div>
      </div>
      <p class="def"><span class="lbl">なぜ</span>${hl(e.why)}</p>
      ${see?`<p class="see"><span class="lbl">→</span>あわせて引く：${see}</p>`:""}
    </article>`;
  }
  $("#entries").innerHTML=html||`<p class="empty">「${esc(state.q)}」に当てはまる項目はありません。<button type="button" id="clear">検索を解除する</button></p>`;
  $("#progress").innerHTML=`身についた <b>${got.size}</b> / ${E.length} 語`;
}
function jump(id){
  if(!document.getElementById(id)){state.q="";state.cat=null;$("#q").value="";chips();render()}
  const el=document.getElementById(id);if(!el)return;
  el.scrollIntoView({block:"start"});el.classList.remove("flash");void el.offsetWidth;el.classList.add("flash");
}
function today(random){
  const d=new Date();const seed=d.getFullYear()*372+d.getMonth()*31+d.getDate();
  const e=random?E[Math.floor(Math.random()*E.length)]:E[seed%E.length];
  $("#todayWord").innerHTML=`<a href="#${e.id}" data-jump="${e.id}">【${e.w}】</a>　${esc(e.ok.split("。")[0])}`;
}

$("#q").addEventListener("input",ev=>{state.q=ev.target.value.trim();render()});
$("#chips").addEventListener("click",ev=>{const b=ev.target.closest(".chip");if(!b)return;state.cat=b.dataset.cat||null;chips();render()});
document.addEventListener("click",ev=>{
  const j=ev.target.closest("[data-jump]");if(j){ev.preventDefault();jump(j.dataset.jump);return}
  const g=ev.target.closest("[data-got]");if(g){const id=g.dataset.got;got.has(id)?got.delete(id):got.add(id);saveGot();
    g.setAttribute("aria-pressed",got.has(id));g.textContent=got.has(id)?"✓ 身についた":"身についた";
    $("#progress").innerHTML=`身についた <b>${got.size}</b> / ${E.length} 語`;return}
  if(ev.target.id==="clear"){state.q="";$("#q").value="";render()}
});
$("#shuffle").addEventListener("click",()=>today(true));

chips();render();today(false);
if(location.hash&&byId[location.hash.slice(1)])setTimeout(()=>jump(location.hash.slice(1)),50);
</script>
